# Toggle: thinking.type = adaptive|disabled (disabled only at effort high or below)
# Effort: output_config.effort = low|medium|high|xhigh|max
# Prices: https://aicodewith.ai/api/models (accessed 2026-11-20). USD per 1M tokens.
# API: Anthropic Messages, https://docs.aicodewith.ai/zh/docs (POST https://api.aicodewith.ai/v1/messages).
# Cache writes: cache_creation_price is the 5-minute write and cache_creation_1h_price is the 1-hour write.
# Limits for this id: https://api.aicodewith.ai/models. That catalog also lists claude-haiku-5-5[1m] at 1,000,000 context with no separate price row, so the alias is not added.
schema = 2
base_model = "anthropic/claude-haiku-5-5"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"] } }

[limit]
context = 200_000

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "5m" = 0.125, "1h" = 0.2 } }

[[cost.text.input.overrides]]
when = { context = { gt = 100_000 } }
price = 0.5
cache = { read = 0.05, write = { "5m" = 0.625, "1h" = 1 } }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 100_000 } }
price = 2.5
