# Pricing source: https://aicodewith.ai/zh/models (accessed 2026-10-12); per 1M tokens, USD.
# Limits/modalities/reasoning source: https://api.aicodewith.ai/models (accessed 2026-10-12).
base_model = "anthropic/claude-sonnet-5"
reasoning = false

[provider]
npm = "@ai-sdk/anthropic"
api = "https://api.aicodewith.ai/v1"

[cost]
input = 2
output = 10
cache_read = 0.2
cache_write = 2.5

[limit]
context = 200_000
output = 65_536

[modalities]
input = ["text"]
output = ["text"]
