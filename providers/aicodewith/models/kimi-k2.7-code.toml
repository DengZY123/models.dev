# Reasoning is always on; the lab accepts no off switch for this model.
# Prices: https://aicodewith.ai/api/models (accessed 2026-11-20). USD per 1M tokens.
# Source amounts are CNY 6.5/27 per 1M tokens.
# CNY→USD rate: 6.69198, 2026-11-20, source: https://open.er-api.com/v6/latest/USD
# API: OpenAI Chat Completions, https://docs.aicodewith.ai/zh/docs (POST https://api.aicodewith.ai/v1/chat/completions).
# Cache is automatic (cache_creation_price is 0). Reasoning controls match the lab provider on this API.
# Limits: https://api.aicodewith.ai/models (accessed 2026-11-20).
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true }
structured_output = true
cache = { implicit = true }

[limit]
context = 200_000
output = 65_536

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.97131
cache = { read = 0.19426 }

[cost.text.output]
price = 4.03468
